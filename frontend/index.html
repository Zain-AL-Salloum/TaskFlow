<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✓</span><span>Task<span class="brand-light">Flow</span></span></div>
      <span class="status"><i></i> Local workspace</span>
    </header>

    <section class="intro">
      <p class="eyebrow">YOUR PERSONAL WORKSPACE</p>
      <h1>Make room for<br><span>what matters.</span></h1>
      <p class="subtitle">A clear list. A calmer mind. One task at a time.</p>
    </section>

    <section class="panel">
      <form id="task-form" class="add-form">
        <input id="task-input" type="text" maxlength="180" placeholder="What needs to get done?" autocomplete="off" required>
        <button type="submit" class="add-button"><span>＋</span> Add task</button>
      </form>

      <div class="list-heading">
        <div><h2>Your tasks</h2><p id="task-count">Loading tasks…</p></div>
        <button id="refresh-button" class="refresh-button" type="button" title="Refresh tasks">↻</button>
      </div>

      <div id="message" class="message" role="status"></div>
      <ul id="task-list" class="task-list"></ul>
      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon">✦</div>
        <h3>Nothing on the list yet</h3>
        <p>Add your first task above and get moving.</p>
      </div>
    </section>
    <footer>Built with FastAPI · SQLite · A little focus</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
